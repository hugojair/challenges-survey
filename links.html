<style>
:root {
  --bg:      #09090f;
  --surf:    #0f0f1a;
  --surf2:   #161625;
  --border:  #1e1e30;
  --border2: #2a2a40;
  --text:    #dde0f0;
  --muted:   #666888;
  --accent:  #7c6ef7;
  --r:       8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; }

/* HEADER */
header {
  padding: 52px 44px 36px;
  background: linear-gradient(135deg, #09090f 0%, #100f1f 100%);
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
header::after {
  content:''; position:absolute; top:-60px; right:-80px;
  width:400px; height:400px; border-radius:50%;
  background: radial-gradient(circle, rgba(124,110,247,.07) 0%, transparent 70%);
  pointer-events:none;
}
.hdr { max-width: 1060px; margin: 0 auto; position: relative; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Syne Mono', monospace; font-size: 11px;
  color: var(--muted); text-decoration: none; margin-bottom: 20px;
  transition: color .15s;
}
.back-link:hover { color: var(--accent); }
h1 { font-family: 'Syne', sans-serif; font-size: clamp(24px,3.5vw,36px); font-weight: 700; letter-spacing: -0.3px; margin-bottom: 8px; }
h1 span { color: var(--accent); }
.subtitle { color: var(--muted); font-size: 13px; font-weight: 300; margin-bottom: 28px; }
.hdr-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.hstat { display: flex; flex-direction: column; }
.hstat-n { font-family: 'Syne Mono', monospace; font-size: 20px; font-weight: 500; }
.hstat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* CONTROLS */
.ctrl {
  position: sticky; top: 0; z-index: 40;
  background: rgba(9,9,15,.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 44px;
}
.ctrl-inner { max-width: 1060px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.srch { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
.srch svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#search {
  width: 100%; padding: 8px 11px 8px 34px;
  background: var(--surf2); border: 1px solid var(--border2);
  border-radius: 7px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px;
  outline: none; transition: border-color .18s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }
.cnt { font-family: 'Syne Mono', monospace; font-size: 11px; color: var(--muted); margin-left: auto; }

/* MAIN */
.main { max-width: 1060px; margin: 0 auto; padding: 28px 44px 80px; }

/* CAT PILLS */
.pills { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 28px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 13px; border-radius: 999px;
  border: 1px solid var(--border2); background: var(--surf);
  font-size: 11.5px; cursor: pointer; color: var(--muted);
  transition: all .15s; user-select: none;
}
.pill:hover { color: var(--text); }
.pill.active { color: #fff; border-color: transparent; }
.pill-n { font-family: 'Syne Mono', monospace; font-size: 10px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 1px 6px; }

/* SECTION */
.sec-hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 0 12px; border-bottom: 1px solid var(--border);
  margin: 20px 0 0;
}
.sec-icon { font-size: 16px; }
.sec-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 600; }
.sec-cnt { margin-left: auto; font-family: 'Syne Mono', monospace; font-size: 10px; color: var(--muted); }

/* URL GRID */
.url-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 14px 0; }

.url-card {
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px 16px;
  background: var(--surf); border: 1px solid var(--border);
  border-radius: var(--r);
  transition: border-color .15s, transform .15s, background .15s;
  animation: popIn .2s ease both;
  text-decoration: none;
}
@keyframes popIn { from { opacity:0; transform: scale(.97); } to { opacity:1; transform: scale(1); } }
.url-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  background: var(--surf2);
}
.url-card.hidden { display: none; }
.card-label {
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
  color: var(--text); line-height: 1.3;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.card-label svg { flex-shrink: 0; margin-top: 2px; color: var(--muted); transition: color .15s; }
.url-card:hover .card-label svg { color: var(--accent); }
.card-url {
  font-family: 'Syne Mono', monospace; font-size: 10px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-ctx {
  font-size: 11px; color: var(--muted); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  border-top: 1px solid var(--border); padding-top: 7px; margin-top: 2px;
}

/* EMPTY */
#empty { display: none; text-align: center; padding: 60px 20px; color: var(--muted); }

@media (max-width: 600px) {
  header, .ctrl, .main { padding-left: 18px; padding-right: 18px; }
  .url-grid { grid-template-columns: 1fr; }
}
</style>

const CAT_META = [
  {name:"Competition Platforms",icon:"🏟",color:"#6366f1"},
  {name:"ML Conferences & Workshops",icon:"📐",color:"#8b5cf6"},
  {name:"LLM & AI Safety",icon:"🤖",color:"#ec4899"},
  {name:"Computer Vision",icon:"👁",color:"#f59e0b"},
  {name:"NLP & Information Retrieval",icon:"📝",color:"#ef4444"},
  {name:"Robotics & Autonomous Systems",icon:"🚗",color:"#10b981"},
  {name:"Biology & Medical Imaging",icon:"🧬",color:"#14b8a6"},
  {name:"Data Mining & ML Competitions",icon:"⛏",color:"#0ea5e9"},
  {name:"Government & Prize Challenges",icon:"🏆",color:"#f97316"},
  {name:"Physical Sciences",icon:"⚛",color:"#64748b"},
  {name:"Papers & Reports",icon:"📄",color:"#a78bfa"},
  {name:"Other Resources",icon:"🔗",color:"#94a3b8"}
];
const catMap = Object.fromEntries(CAT_META.map(c=>[c.name,c]));
let activeFilter = 'all';

// Build pills
const pillsEl = document.getElementById('pills');
const allPill = Object.assign(document.createElement('button'),{className:'pill active',textContent:''});
allPill.innerHTML = `All <span class="pill-n">${URLS.length}</span>`;
allPill.dataset.cat = 'all';
allPill.onclick = () => setFilter('all', allPill);
pillsEl.appendChild(allPill);

CAT_META.forEach(c => {
  const cnt = URLS.filter(u=>u.cat===c.name).length;
  if (!cnt) return;
  const btn = document.createElement('button');
  btn.className = 'pill'; btn.dataset.cat = c.name;
  btn.innerHTML = `${c.icon} ${c.name} <span class="pill-n">${cnt}</span>`;
  btn.onclick = () => setFilter(c.name, btn);
  pillsEl.appendChild(btn);
});

function setFilter(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.remove('active'); p.style.background = ''; p.style.borderColor = ''; p.style.color = '';
  });
  el.classList.add('active');
  if (cat !== 'all') {
    const c = catMap[cat];
    el.style.background = c.color; el.style.borderColor = c.color; el.style.color = '#fff';
  }
  render();
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  return URLS.filter(u => {
    if (activeFilter !== 'all' && u.cat !== activeFilter) return false;
    if (!q) return true;
    return (u.label + u.url + u.ctx + u.cat).toLowerCase().includes(q);
  });
}

function makeCard(u, idx) {
  const domain = (() => { try { return new URL(u.url).hostname.replace('www.',''); } catch(e) { return u.url; } })();
  const ctx = u.ctx ? `<div class="card-ctx">${u.ctx.replace(/</g,'&lt;')}</div>` : '';
  return `<a class="url-card" href="${u.url}" target="_blank" rel="noopener" style="animation-delay:${Math.min(idx*12,200)}ms">
    <div class="card-label">
      <span>${u.label}</span>
      <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </div>
    <div class="card-url">${domain}</div>
    ${ctx}
  </a>`;
}

function render() {
  const data = getFiltered();
  const root = document.getElementById('list-root');
  const empty = document.getElementById('empty');
  document.getElementById('result-cnt').textContent = `${data.length} / ${URLS.length}`;
  if (!data.length) { root.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';

  const groups = {};
  data.forEach(u => { (groups[u.cat] = groups[u.cat]||[]).push(u); });

  let html = '';
  CAT_META.forEach(c => {
    const items = groups[c.name];
    if (!items?.length) return;
    html += `<div class="sec-hdr">
      <span class="sec-icon">${c.icon}</span>
      <span class="sec-title" style="color:${c.color}">${c.name}</span>
      <span class="sec-cnt">${items.length}</span>
    </div>
    <div class="url-grid">`;
    items.forEach((u,i) => { html += makeCard(u, i); });
    html += `</div>`;
  });
  root.innerHTML = html;
}

document.getElementById('total-n').textContent = URLS.length;
document.getElementById('search').addEventListener('input', render);
render();
</script>
