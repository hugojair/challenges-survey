<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Academic Competitions — Reference Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0d0f14;
  --surface:  #13161e;
  --border:   #1e2330;
  --border2:  #2a3045;
  --text:     #e2e5f0;
  --muted:    #7a83a0;
  --accent:   #5b8dee;
  --radius:   10px;
  --mono:     'DM Mono', monospace;
  --sans:     'DM Sans', sans-serif;
  --serif:    'DM Serif Display', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ─── HEADER ──────────────────────────────────────────────── */
header {
  padding: 56px 40px 40px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(160deg, #0d0f14 0%, #111525 100%);
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 120% at 80% -20%, rgba(91,141,238,.08) 0%, transparent 60%);
  pointer-events: none;
}
.header-inner { max-width: 1100px; margin: 0 auto; position: relative; }
h1 {
  font-family: var(--serif);
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 400;
  letter-spacing: -0.5px;
  line-height: 1.15;
  margin-bottom: 10px;
}
h1 em { font-style: italic; color: var(--accent); }
.subtitle {
  color: var(--muted);
  font-size: 14px;
  font-weight: 300;
  margin-bottom: 32px;
}
.stats-row {
  display: flex; gap: 28px; flex-wrap: wrap;
}
.stat {
  display: flex; flex-direction: column; gap: 2px;
}
.stat-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
}
.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* ─── CONTROLS ─────────────────────────────────────────────── */
.controls-wrap {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,15,20,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 14px 40px;
}
.controls-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#search {
  width: 100%; padding: 9px 12px 9px 38px;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-family: var(--sans); font-size: 13.5px;
  outline: none; transition: border-color .2s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }

.seg { display: flex; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; }
.seg button {
  padding: 8px 16px; background: none; border: none; border-right: 1px solid var(--border2);
  color: var(--muted); font-family: var(--sans); font-size: 12.5px; cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap;
}
.seg button:last-child { border-right: none; }
.seg button.active, .seg button:hover { background: var(--border2); color: var(--text); }
.seg button.active { color: var(--accent); font-weight: 500; }

#sort-select {
  padding: 8px 12px; background: var(--surface); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-family: var(--sans); font-size: 12.5px;
  outline: none; cursor: pointer;
}

.result-count { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-family: var(--mono); }

/* ─── LAYOUT ────────────────────────────────────────────────── */
.main { max-width: 1100px; margin: 0 auto; padding: 32px 40px 80px; }

/* ─── CATEGORY NAV PILLS ───────────────────────────────────── */
.cat-nav {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
}
.cat-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border2);
  font-size: 12px; cursor: pointer; transition: all .15s;
  color: var(--muted); user-select: none;
}
.cat-pill:hover { border-color: var(--border2); color: var(--text); transform: translateY(-1px); }
.cat-pill.active { color: #fff; border-color: transparent; }
.cat-pill .pill-count {
  font-family: var(--mono); font-size: 10px;
  background: rgba(255,255,255,.12); border-radius: 999px;
  padding: 1px 7px;
}

/* ─── SECTION HEADERS ──────────────────────────────────────── */
.section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 0 14px; margin-top: 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.section-icon { font-size: 18px; line-height: 1; }
.section-title { font-family: var(--serif); font-size: 20px; font-weight: 400; }
.section-count { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }

/* ─── REF CARDS ─────────────────────────────────────────────── */
.ref-card {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 0 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  border-radius: 0;
  animation: fadeIn .25s ease both;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
.ref-card:hover { background: rgba(255,255,255,.018); margin: 0 -12px; padding: 14px 12px; border-radius: 6px; border-color: transparent; }
.ref-card.hidden { display: none; }

.ref-year {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  padding-top: 2px;
  text-align: right;
}
.ref-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.ref-title {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.45;
}
.ref-title a {
  color: inherit; text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color .15s, color .15s;
}
.ref-title a:hover { color: var(--accent); border-bottom-color: var(--accent); }

.ref-meta {
  font-size: 12px; color: var(--muted);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.ref-authors { font-style: italic; }
.ref-venue { max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-badge {
  font-family: var(--mono); font-size: 10px; padding: 2px 8px;
  border-radius: 4px; background: var(--surface); border: 1px solid var(--border2);
  color: var(--muted); flex-shrink: 0;
}
.ref-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--accent); text-decoration: none;
  padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(91,141,238,.3);
  transition: background .15s; flex-shrink: 0;
}
.ref-link:hover { background: rgba(91,141,238,.1); }

/* ─── EMPTY STATE ───────────────────────────────────────────── */
#empty {
  display: none; text-align: center; padding: 80px 20px;
  color: var(--muted);
}
#empty .empty-icon { font-size: 40px; margin-bottom: 16px; }
#empty p { font-size: 15px; }

/* ─── TIMELINE VIEW ─────────────────────────────────────────── */
.timeline-year-group { margin-bottom: 4px; }
.year-marker {
  display: inline-block;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--accent); background: rgba(91,141,238,.08);
  border: 1px solid rgba(91,141,238,.2);
  border-radius: 4px; padding: 2px 10px; margin: 20px 0 4px;
}

/* ─── SCROLLBAR ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 640px) {
  header, .controls-wrap, .main { padding-left: 20px; padding-right: 20px; }
  .ref-card { grid-template-columns: 44px 1fr; }
}
</style>
</head>

  {key:'https://doi.org/10.1111/j.1749-6632.2009.04497.x',title:'Lessons from the DREAM2 Challenges',author:'Stolovitzky et al.',year:2009,venue:'Annals of the New York Academy of Sciences',url:'https://nyaspubs.onlinelibrary.wiley.com/doi/abs/10.1111/j.1749-6632.2009.04497.x',cat:'Other'}
];

const CATS = [
  {name:"LLM Benchmarks & Evaluation",      icon:"🤖", color:"#6366f1"},
  {name:"AI Agents & Agentic AI",            icon:"🕹️", color:"#8b5cf6"},
  {name:"Data-Centric AI",                   icon:"🗄️", color:"#0ea5e9"},
  {name:"AutoML & Meta-Learning",            icon:"⚙️", color:"#10b981"},
  {name:"Computer Vision",                   icon:"👁️", color:"#f59e0b"},
  {name:"NLP & Information Retrieval",       icon:"📝", color:"#ef4444"},
  {name:"Robotics, RL & Autonomous Systems", icon:"🤖", color:"#ec4899"},
  {name:"Biology & Medical Imaging",         icon:"🧬", color:"#14b8a6"},
  {name:"Competition Platforms & Methodology",icon:"🏆", color:"#f97316"},
  {name:"Physical Sciences",                 icon:"⚛️", color:"#64748b"},
];
const catMap = Object.fromEntries(CATS.map(c => [c.name, c]));

let activeFilter = 'all';
let currentView  = 'topic';

// Build nav pills
const nav = document.getElementById('cat-nav');
const allPill = document.createElement('button');
allPill.className = 'cat-pill active';
allPill.dataset.cat = 'all';
allPill.innerHTML = `All <span class="pill-count">${REFS.length}</span>`;
allPill.style.borderColor = '#3b4260';
allPill.onclick = () => setFilter('all', allPill);
nav.appendChild(allPill);

CATS.forEach(c => {
  const count = REFS.filter(r => r.cat === c.name).length;
  if (!count) return;
  const btn = document.createElement('button');
  btn.className = 'cat-pill';
  btn.dataset.cat = c.name;
  btn.innerHTML = `${c.icon} ${c.name} <span class="pill-count">${count}</span>`;
  btn.onclick = () => setFilter(c.name, btn);
  nav.appendChild(btn);
});

function setFilter(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.cat-pill').forEach(p => {
    p.classList.remove('active');
    p.style.background = '';
    p.style.borderColor = '';
    p.style.color = '';
  });
  el.classList.add('active');
  if (cat !== 'all') {
    const c = catMap[cat];
    el.style.background = c.color;
    el.style.borderColor = c.color;
    el.style.color = '#fff';
  } else {
    el.style.borderColor = '#3b4260';
  }
  render();
}

function setView(v, el) {
  currentView = v;
  document.querySelectorAll('.seg button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const sort = document.getElementById('sort-select').value;
  let data = REFS.filter(r => {
    if (activeFilter !== 'all' && r.cat !== activeFilter) return false;
    if (!q) return true;
    return (r.title+r.author+r.venue+r.year).toLowerCase().includes(q);
  });
  if (sort === 'year-desc') data.sort((a,b) => b.year - a.year || a.title.localeCompare(b.title));
  else if (sort === 'year-asc') data.sort((a,b) => a.year - b.year || a.title.localeCompare(b.title));
  else data.sort((a,b) => a.title.localeCompare(b.title));
  return data;
}

function makeCard(r, idx) {
  const c = catMap[r.cat] || {color:'#888'};
  const yearStr = r.year > 0 ? r.year : '—';
  const link = r.url
    ? `<a class="ref-link" href="${r.url}" target="_blank" rel="noopener">
         <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
           <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
           <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
         </svg>
         Link
       </a>`
    : '';
  const titleContent = r.url
    ? `<a href="${r.url}" target="_blank" rel="noopener">${r.title}</a>`
    : r.title;
  const venueShort = r.venue.length > 90 ? r.venue.slice(0,87)+'…' : r.venue;
  return `
  <div class="ref-card" style="animation-delay:${Math.min(idx*18,300)}ms">
    <div class="ref-year">${yearStr}</div>
    <div class="ref-body">
      <div class="ref-title">${titleContent}</div>
      <div class="ref-meta">
        <span class="ref-authors">${r.author}</span>
        ${venueShort ? `<span class="ref-venue" title="${r.venue}">${venueShort}</span>` : ''}
        ${link}
      </div>
    </div>
  </div>`;
}

function render() {
  const data = getFiltered();
  const root = document.getElementById('list-root');
  const empty = document.getElementById('empty');
  const count = document.getElementById('result-count');
  count.textContent = `${data.length} / ${REFS.length}`;

  if (!data.length) { root.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  if (currentView === 'topic') {
    // Group by category in CATS order
    const groups = {};
    data.forEach(r => { (groups[r.cat] = groups[r.cat]||[]).push(r); });
    let html = '';
    CATS.forEach(c => {
      const items = groups[c.name];
      if (!items || !items.length) return;
      html += `<div class="section-header">
        <span class="section-icon">${c.icon}</span>
        <span class="section-title" style="color:${c.color}">${c.name}</span>
        <span class="section-count">${items.length} ref${items.length!==1?'s':''}</span>
      </div>`;
      items.forEach((r,i) => { html += makeCard(r,i); });
    });
    // Uncategorized
    const uncatItems = data.filter(r => !CATS.find(c=>c.name===r.cat));
    if (uncatItems.length) {
      html += `<div class="section-header"><span class="section-title">Other</span></div>`;
      uncatItems.forEach((r,i) => { html += makeCard(r,i); });
    }
    root.innerHTML = html;

  } else {
    // Timeline view: group by year descending
    const byYear = {};
    data.forEach(r => { const y = r.year > 0 ? r.year : 0; (byYear[y]=byYear[y]||[]).push(r); });
    const years = Object.keys(byYear).map(Number).sort((a,b)=>b-a);
    let html = '';
    years.forEach(y => {
      html += `<div class="timeline-year-group">
        <div class="year-marker">${y||'undated'}</div>`;
      byYear[y].forEach((r,i) => { html += makeCard(r,i); });
      html += `</div>`;
    });
    root.innerHTML = html;
  }
}

// Stats
document.getElementById('stat-total').textContent = REFS.length;
document.getElementById('stat-linked').textContent = REFS.filter(r=>r.url).length;

document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
